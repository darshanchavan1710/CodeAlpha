<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | ApexStore</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="container navbar">
      <a href="/index.html" class="logo"><i class="fas fa-bolt"></i> ApexStore</a>
      <nav class="nav-links">
        <a href="/index.html" class="nav-link">Home</a>
      </nav>
      <div class="nav-actions">
        <a href="/cart.html" class="cart-nav-btn">
          <i class="fas fa-shopping-cart"></i>
          <span id="cart-badge" class="hidden">0</span>
        </a>
        <div id="user-nav">
          <!-- Populated dynamically by app.js -->
        </div>
      </div>
    </div>
  </header>

  <!-- Product Details Container -->
  <main class="container product-details-container" id="product-details-view">
    <!-- Loaded dynamically by product.js -->
    <div class="text-center" style="padding: 100px 0;">
      <i class="fas fa-circle-notch fa-spin" style="font-size: 40px; color: var(--primary);"></i>
      <p style="margin-top: 15px; color: var(--text-secondary);">Loading product details...</p>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-layout">
      <p>&copy; 2026 ApexStore Inc. All rights reserved.</p>
      <p>Crafted for premium user experiences.</p>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/product.js"></script>
</body>
</html>
