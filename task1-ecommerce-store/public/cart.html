<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | ApexStore</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="container navbar">
      <a href="/index.html" class="logo"><i class="fas fa-bolt"></i> ApexStore</a>
      <nav class="nav-links">
        <a href="/index.html" class="nav-link">Home</a>
      </nav>
      <div class="nav-actions">
        <a href="/cart.html" class="cart-nav-btn">
          <i class="fas fa-shopping-cart"></i>
          <span id="cart-badge" class="hidden">0</span>
        </a>
        <div id="user-nav">
          <!-- Populated dynamically by app.js -->
        </div>
      </div>
    </div>
  </header>

  <!-- Cart / Checkout Multi-step Grid -->
  <main class="container" style="padding-top: 40px; padding-bottom: 80px;">
    <!-- Step Indicator -->
    <div class="checkout-steps-bar" id="checkout-steps-bar">
      <div class="step-item active" id="step-nav-1">
        <span class="step-number">1</span>
        <span class="step-title">Cart Items</span>
      </div>
      <div class="step-divider"></div>
      <div class="step-item" id="step-nav-2">
        <span class="step-number">2</span>
        <span class="step-title">Shipping Address</span>
      </div>
      <div class="step-divider"></div>
      <div class="step-item" id="step-nav-3">
        <span class="step-number">3</span>
        <span class="step-title">Payment & Confirm</span>
      </div>
    </div>

    <div class="cart-layout" id="cart-layout-view">
      <!-- Left Panel: Dynamic Content (Step 1: Items, Step 2: Address, Step 3: Payment) -->
      <section class="cart-items-panel" id="main-step-panel">
        <h2 class="panel-title" id="step-panel-title">Shopping Cart</h2>
        
        <!-- Step 1 View -->
        <div id="step-1-view">
          <div id="cart-items-list">
            <!-- Loaded dynamically by cart.js -->
          </div>
        </div>

        <!-- Step 2 View: Address Form -->
        <div id="step-2-view" class="hidden">
          <form id="shipping-address-form">
            <div class="form-group">
              <label for="ship-name">Full Name</label>
              <input type="text" id="ship-name" class="form-control" placeholder="e.g. Darshan Chavan" required>
            </div>
            <div class="form-group">
              <label for="ship-address">Street Address</label>
              <input type="text" id="ship-address" class="form-control" placeholder="123 Main Street, Suite 400" required>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label for="ship-city">City</label>
                <input type="text" id="ship-city" class="form-control" placeholder="Mumbai / New York" required>
              </div>
              <div class="form-group">
                <label for="ship-zip">Zip / Postal Code</label>
                <input type="text" id="ship-zip" class="form-control" placeholder="400001" required>
              </div>
            </div>
          </form>
        </div>

        <!-- Step 3 View: Payment Method -->
        <div id="step-3-view" class="hidden">
          <div class="payment-methods">
            <label class="payment-option-card active" id="opt-card">
              <input type="radio" name="paymentMethod" value="card" checked>
              <div class="pay-details">
                <span class="pay-title"><i class="far fa-credit-card"></i> Credit / Debit Card</span>
                <span class="pay-sub">Visa, Mastercard, Amex</span>
              </div>
            </label>
            <label class="payment-option-card" id="opt-upi">
              <input type="radio" name="paymentMethod" value="upi">
              <div class="pay-details">
                <span class="pay-title"><i class="fas fa-mobile-alt"></i> UPI / GPay / PhonePe</span>
                <span class="pay-sub">Instant payment via VPA</span>
              </div>
            </label>
            <label class="payment-option-card" id="opt-cod">
              <input type="radio" name="paymentMethod" value="cod">
              <div class="pay-details">
                <span class="pay-title"><i class="fas fa-money-bill-wave"></i> Cash on Delivery</span>
                <span class="pay-sub">Pay cash when delivered</span>
              </div>
            </label>
          </div>

          <!-- Card Details Input -->
          <div id="card-fields" class="mt-4" style="background: var(--bg-tertiary); padding: 20px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
            <div class="form-group">
              <label>Card Number</label>
              <input type="text" id="pay-card-num" class="form-control" placeholder="4242 •••• •••• 4242" value="4242 4242 4242 4242">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label>Expiry Date</label>
                <input type="text" id="pay-expiry" class="form-control" placeholder="MM/YY" value="12/28">
              </div>
              <div class="form-group">
                <label>CVV</label>
                <input type="password" id="pay-cvv" class="form-control" placeholder="123" value="123">
              </div>
            </div>
          </div>

          <!-- UPI Details Input -->
          <div id="upi-fields" class="mt-4 hidden" style="background: var(--bg-tertiary); padding: 20px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
            <div class="form-group">
              <label>UPI ID / VPA</label>
              <input type="text" id="pay-upi-id" class="form-control" placeholder="username@upi" value="darshan@upi">
            </div>
          </div>
        </div>

      </section>

      <!-- Right Panel: Checkout / Cost summary -->
      <section class="cart-summary-panel">
        <h2 class="panel-title">Order Summary</h2>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="summary-subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Estimated Shipping</span>
          <span id="summary-shipping">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Estimated Tax (8%)</span>
          <span id="summary-tax">$0.00</span>
        </div>
        <div class="summary-row summary-row-total">
          <span>Total</span>
          <span id="summary-total">$0.00</span>
        </div>
        
        <div class="mt-4" id="checkout-action-box">
          <!-- Filled dynamically by cart.js -->
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-layout">
      <p>&copy; 2026 ApexStore Inc. All rights reserved.</p>
      <p>Crafted for premium user experiences.</p>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
