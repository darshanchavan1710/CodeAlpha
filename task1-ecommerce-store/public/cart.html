<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | ApexStore</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="container navbar">
      <a href="/index.html" class="logo"><i class="fas fa-bolt"></i> ApexStore</a>
      <nav class="nav-links">
        <a href="/index.html" class="nav-link">Home</a>
      </nav>
      <div class="nav-actions">
        <a href="/cart.html" class="cart-nav-btn">
          <i class="fas fa-shopping-cart"></i>
          <span id="cart-badge" class="hidden">0</span>
        </a>
        <div id="user-nav">
          <!-- Populated dynamically by app.js -->
        </div>
      </div>
    </div>
  </header>

  <!-- Cart / Checkout Grid -->
  <main class="container">
    <div class="cart-layout" id="cart-layout-view">
      <!-- Left Panel: Cart items -->
      <section class="cart-items-panel">
        <h2 class="panel-title">Shopping Cart</h2>
        <div id="cart-items-list">
          <!-- Loaded dynamically by cart.js -->
        </div>
      </section>

      <!-- Right Panel: Checkout / Cost summary -->
      <section class="cart-summary-panel">
        <h2 class="panel-title">Order Summary</h2>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="summary-subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Estimated Shipping</span>
          <span id="summary-shipping">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Estimated Tax (8%)</span>
          <span id="summary-tax">$0.00</span>
        </div>
        <div class="summary-row summary-row-total">
          <span>Total</span>
          <span id="summary-total">$0.00</span>
        </div>
        
        <div class="mt-4" id="checkout-action-box">
          <!-- Filled dynamically depending on cart status and auth status -->
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-layout">
      <p>&copy; 2026 ApexStore Inc. All rights reserved.</p>
      <p>Crafted for premium user experiences.</p>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
