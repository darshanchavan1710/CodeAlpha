<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect | ApexSocial</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="container navbar">
      <a href="/index.html" class="logo"><i class="fas fa-share-nodes"></i> ApexSocial</a>
      <nav class="nav-links">
        <a href="/index.html" class="nav-link">Feed</a>
      </nav>
      <div class="nav-actions" id="auth-nav">
        <!-- Filled by app.js -->
      </div>
    </div>
  </header>

  <!-- Auth Box -->
  <main class="container">
    <div class="auth-wrapper">
      <div class="auth-tabs">
        <button id="login-tab-btn" class="auth-tab-btn active">Log In</button>
        <button id="register-tab-btn" class="auth-tab-btn">Create Account</button>
      </div>

      <div class="auth-body">
        <form id="auth-form">
          <!-- Username field (hidden by default on login) -->
          <div id="username-group" class="form-group hidden">
            <label for="username">Username</label>
            <input type="text" id="username" class="form-control" placeholder="Choose a username">
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" id="submit-btn" class="auth-submit-btn">Log In</button>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-layout">
      <p>&copy; 2026 ApexSocial. All rights reserved.</p>
      <p>Premium dark-mode social network.</p>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
