<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | ApexSocial</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="container navbar">
      <a href="/index.html" class="logo"><i class="fas fa-share-nodes"></i> ApexSocial</a>
      <nav class="nav-links">
        <a href="/index.html" class="nav-link">Feed</a>
      </nav>
      <div class="nav-actions" id="auth-nav">
        <!-- Populated dynamically by app.js -->
      </div>
    </div>
  </header>

  <!-- Profile Layout -->
  <main class="container profile-wrapper">
    <!-- Profile Header Card -->
    <section class="profile-card" id="profile-header-card">
      <div class="text-center" style="width: 100%; padding: 20px 0;">
        <i class="fas fa-circle-notch fa-spin" style="font-size: 32px; color: var(--primary);"></i>
      </div>
    </section>

    <!-- User's Posts Feed -->
    <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">User Posts</h3>
    <section id="user-posts-stream" class="posts-stream">
      <!-- Loaded dynamically via profile.js -->
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-layout">
      <p>&copy; 2026 ApexSocial. All rights reserved.</p>
      <p>Premium dark-mode social network.</p>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
